name: Release VoiceInk

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to sync to Homebrew
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build-release:
    name: build release (${{ matrix.architecture }})
    needs: validate-release
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - arm64
          - x86_64

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Build and verify architecture-specific release package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/release.sh \
            --version "$version" \
            --architecture "${{ matrix.architecture }}" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --output-dir "$RUNNER_TEMP/voiceink-release"

      - name: Upload architecture-specific release package
        uses: actions/upload-artifact@v4
        with:
          name: voiceink-release-${{ matrix.architecture }}
          path: ${{ runner.temp }}/voiceink-release/VoiceInk-${{ matrix.architecture }}.zip
          if-no-files-found: error
          retention-days: 1

  build-legacy-updater-bridge:
    name: build legacy updater bridge
    needs: build-release
    if: github.ref_name == 'v2.2.44'
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Download both architecture packages
        uses: actions/download-artifact@v4
        with:
          pattern: voiceink-release-*
          path: ${{ runner.temp }}/voiceink-release
          merge-multiple: true

      - name: Build and verify legacy universal updater bridge
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/build-legacy-universal-package.sh \
            --version "$version" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --output-dir "$RUNNER_TEMP/voiceink-release"

      - name: Upload legacy updater bridge
        uses: actions/upload-artifact@v4
        with:
          name: voiceink-release-legacy-bridge
          path: ${{ runner.temp }}/voiceink-release/VoiceInk.zip
          if-no-files-found: error
          retention-days: 1

  publish-release:
    needs:
      - build-release
      - build-legacy-updater-bridge
    if: >-
      ${{
        always() &&
        needs.build-release.result == 'success' &&
        (needs.build-legacy-updater-bridge.result == 'success' ||
         needs.build-legacy-updater-bridge.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: voiceink-release-*
          path: ${{ runner.temp }}/voiceink-release
          merge-multiple: true

      - name: Enforce one-time legacy updater bridge
        shell: bash
        run: |
          set -euo pipefail
          legacy_archive="$RUNNER_TEMP/voiceink-release/VoiceInk.zip"
          if [[ "$GITHUB_REF_NAME" == "v2.2.44" ]]; then
            [[ -f "$legacy_archive" ]]
          elif [[ -e "$legacy_archive" ]]; then
            echo "::error::VoiceInk.zip is allowed only for the v2.2.44 legacy updater bridge"
            exit 1
          fi

      - name: Generate and validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/generate-release-metadata.sh \
            --version "$version" \
            --output-dir "$RUNNER_TEMP/voiceink-release"
          (
            cd "$RUNNER_TEMP/voiceink-release"
            shasum -a 256 -c SHA256SUMS
          )

      - name: Validate generated Homebrew Cask
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/voiceink-release"
          cask="$release_dir/voiceink.rb"
          version="${GITHUB_REF_NAME#v}"
          arm64_checksum="$(awk '$2 == "VoiceInk-arm64.zip" { print $1 }' "$release_dir/SHA256SUMS")"
          x86_64_checksum="$(awk '$2 == "VoiceInk-x86_64.zip" { print $1 }' "$release_dir/SHA256SUMS")"
          ruby -c "$cask"
          grep -F "version \"$version\"" "$cask"
          grep -F 'arch arm: "arm64", intel: "x86_64"' "$cask"
          grep -F "sha256 arm:   \"$arm64_checksum\"" "$cask"
          grep -F "intel: \"$x86_64_checksum\"" "$cask"
          grep -F 'releases/download/v#{version}/VoiceInk-#{arch}.zip' "$cask"
          grep -F 'com.apple.quarantine' "$cask"
          ! grep -Eq ':latest|:no_check|__[A-Z0-9_]+__' "$cask"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/voiceink-release"
          assets=(
            "$release_dir/VoiceInk-arm64.zip"
            "$release_dir/VoiceInk-x86_64.zip"
            "$release_dir/SHA256SUMS"
            "$release_dir/voiceink.rb"
          )
          if [[ -f "$release_dir/VoiceInk.zip" ]]; then
            assets+=("$release_dir/VoiceInk.zip")
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "VoiceInk $GITHUB_REF_NAME" \
              --generate-notes
          fi

  update-homebrew-tap:
    needs: publish-release
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.publish-release.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    concurrency:
      group: update-homebrew-tap
      cancel-in-progress: false

    steps:
      - name: Verify Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN must grant contents:write on bifrost-proxy/homebrew-voiceink"
            exit 1
          fi

      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: bifrost-proxy/homebrew-voiceink
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-voiceink

      - name: Download published Cask
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/voiceink-cask"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern voiceink.rb \
            --dir "$RUNNER_TEMP/voiceink-cask"

      - name: Update Homebrew tap
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          release_cask="$RUNNER_TEMP/voiceink-cask/voiceink.rb"
          tap_repo="$GITHUB_WORKSPACE/homebrew-voiceink"
          tap_cask="$tap_repo/Casks/voiceink.rb"

          ruby -c "$release_cask"
          grep -F "version \"$version\"" "$release_cask"
          current_version="$(sed -nE 's/^[[:space:]]*version "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' "$tap_cask")"
          [[ -n "$current_version" ]]

          if [[ "$current_version" == "$version" ]]; then
            echo "Homebrew tap already contains VoiceInk $version"
            exit 0
          fi

          newest_version="$(printf '%s\n' "$current_version" "$version" | sort -V | tail -n 1)"
          if [[ "$newest_version" != "$version" ]]; then
            echo "Skipping VoiceInk $version because the tap already contains newer version $current_version"
            exit 0
          fi

          install -m 0644 "$release_cask" "$tap_cask"
          ruby -c "$tap_cask"

          git -C "$tap_repo" config user.name "github-actions[bot]"
          git -C "$tap_repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tap_repo" add Casks/voiceink.rb
          git -C "$tap_repo" diff --cached --check
          git -C "$tap_repo" commit -m "Update VoiceInk to $version"
          git -C "$tap_repo" push origin HEAD:main

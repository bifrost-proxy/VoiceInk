name: Release VoiceInk

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Select Xcode 26.5
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Build and verify universal release package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          scripts/release.sh \
            --version "$version" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --output-dir "$RUNNER_TEMP/voiceink-release"

      - name: Validate generated Homebrew Cask
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/voiceink-release"
          cask="$release_dir/voiceink.rb"
          version="${GITHUB_REF_NAME#v}"
          checksum="$(awk '$2 == "VoiceInk.zip" { print $1 }' "$release_dir/SHA256SUMS")"
          ruby -c "$cask"
          grep -F "version \"$version\"" "$cask"
          grep -F "sha256 \"$checksum\"" "$cask"
          grep -F 'releases/download/v#{version}/VoiceInk.zip' "$cask"
          grep -F 'com.apple.quarantine' "$cask"
          ! grep -Eq ':latest|:no_check|__[A-Z0-9_]+__' "$cask"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/voiceink-release"
          assets=(
            "$release_dir/VoiceInk.zip"
            "$release_dir/SHA256SUMS"
            "$release_dir/voiceink.rb"
          )

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "VoiceInk $GITHUB_REF_NAME" \
              --generate-notes
          fi

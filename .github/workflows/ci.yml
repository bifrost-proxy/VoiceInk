name: Test VoiceInk

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-metadata:
    name: architecture-specific release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate CPU-specific release metadata
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            scripts/generate-release-metadata.sh \
            scripts/release.sh
          release_dir="$(mktemp -d)"
          printf 'arm64 package\n' > "$release_dir/VoiceInk-arm64.zip"
          printf 'x86_64 package\n' > "$release_dir/VoiceInk-x86_64.zip"
          scripts/generate-release-metadata.sh \
            --version 9.9.9 \
            --output-dir "$release_dir"
          [[ "$(wc -l < "$release_dir/SHA256SUMS" | tr -d ' ')" == "2" ]]
          grep -Eq '^[0-9a-f]{64}  VoiceInk-arm64\.zip$' "$release_dir/SHA256SUMS"
          grep -Eq '^[0-9a-f]{64}  VoiceInk-x86_64\.zip$' "$release_dir/SHA256SUMS"
          ! grep -Eq '  VoiceInk\.zip$' "$release_dir/SHA256SUMS"
          (cd "$release_dir" && shasum -a 256 -c SHA256SUMS)

  tests:
    name: tests (${{ matrix.architecture }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - arm64
          - x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Restore native dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp/build-apple/whisper.xcframework
            Dependencies/SherpaOnnxMac/Binaries
          key: native-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ matrix.architecture }}-${{ hashFiles('Makefile', 'scripts/prepare-sherpa-onnx.sh') }}

      - name: Prepare native dependencies
        shell: bash
        run: |
          set -euo pipefail
          make whisper
          scripts/prepare-sherpa-onnx.sh

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          architecture="${{ matrix.architecture }}"
          xcodebuild_args=(
            test
            -project VoiceInk.xcodeproj
            -scheme VoiceInk
            -destination "platform=macOS,arch=$architecture"
            -only-testing:VoiceInkTests
            -parallel-testing-enabled NO
          )
          if [[ "$architecture" == "x86_64" ]]; then
            # Cross-architecture Release WMO builds can exhaust the hosted arm64
            # runner, including inside Swift packages that ignore command-line
            # compilation-mode overrides. Debug still compiles and exercises the
            # complete x86_64 test target; arm64 retains Release-mode coverage.
            xcodebuild_args+=(
              -configuration Debug
              -jobs 1
              SWIFT_COMPILATION_MODE=singlefile
            )

            # NSFileCoordinator can stall these tests after a long Rosetta
            # app-host session. Keep their x86 coverage, but run each in a
            # fresh process and exclude them from the subsequent full target run.
            split_tests=(
              'VoiceInkTests/VoiceInkTests/syncCoreSplitsLargeMutationSetsIntoValidImmutableOperations()'
              'VoiceInkTests/VoiceInkTests/copiedSyncIdentityRotatesForAnotherMac()'
            )
            split_test_index=0
            for split_test in "${split_tests[@]}"; do
              split_test_log="$RUNNER_TEMP/voiceink-x86-split-test-$split_test_index.log"
              xcodebuild test \
                -project VoiceInk.xcodeproj \
                -scheme VoiceInk \
                -destination "platform=macOS,arch=$architecture" \
                -only-testing:"$split_test" \
                -parallel-testing-enabled NO \
                -configuration Debug \
                -jobs 1 \
                SWIFT_COMPILATION_MODE=singlefile \
                ARCHS="$architecture" \
                ONLY_ACTIVE_ARCH=YES \
                CODE_SIGNING_ALLOWED=NO \
                ENABLE_TESTABILITY=YES | tee "$split_test_log"
              grep -Eq 'Test run with 1 test.*passed' "$split_test_log"
              xcodebuild_args+=(-skip-testing:"$split_test")
              split_test_index=$((split_test_index + 1))
            done
          fi
          xcodebuild "${xcodebuild_args[@]}" \
            ARCHS="$architecture" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES
